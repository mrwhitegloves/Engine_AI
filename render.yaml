services:
  - type: web
    name: engine-ai-backend
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:flask_app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: MPLBACKEND
        value: Agg
      - key: NUMBA_CACHE_DIR
        value: /tmp/numba_cache
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
